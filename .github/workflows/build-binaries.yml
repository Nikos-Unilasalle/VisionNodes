name: Build binaries

# Builds self-contained desktop binaries on GitHub runners (no local multi-GB
# downloads). Each runner bundles a relocatable Python engine (build_pyengine)
# then runs `tauri build`.
#
#   • Push a tag `vX.Y.Z`  → builds all platforms + attaches them to a *draft*
#                            GitHub Release (you review, then publish).
#   • Run manually (Actions → Build binaries → Run workflow) → builds all
#                            platforms and uploads them as workflow artifacts.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb only: linuxdeploy chokes on the bundled Python's many .so files
          # when packaging the AppImage. The .deb (Tauri's native bundler) is
          # reliable. Revisit AppImage separately if cross-distro portability
          # is needed.
          - { os: ubuntu-22.04,   name: linux,       bundles: 'deb',          pyengine: bash }
          - { os: macos-14,       name: macos-arm64, bundles: 'dmg,app',      pyengine: bash }
          - { os: windows-latest, name: windows,     bundles: 'msi,nsis',     pyengine: pwsh }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # AppImage + a Python bundle + cargo target can be tight on the ~14 GB
      # Linux runner; reclaim space first.
      - name: Free disk space (Linux)
        if: matrix.name == 'linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      - name: Install Tauri system deps (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # tauri-action does NOT install npm deps itself; without this the build
      # fails with exit 127 (tauri CLI not found).
      - name: Install frontend dependencies
        run: npm ci

      - uses: astral-sh/setup-uv@v3

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Bundle the self-contained Python engine into src-tauri/resources/
      # BEFORE tauri build (which packages those resources). On Linux this
      # installs CPU-only torch to keep the AppImage small.
      - name: Bundle Python engine (unix)
        if: matrix.pyengine == 'bash'
        run: ./scripts/build_pyengine.sh

      - name: Bundle Python engine (windows)
        if: matrix.pyengine == 'pwsh'
        run: powershell -ExecutionPolicy Bypass -File scripts/build_pyengine.ps1

      - name: Build app + draft release (tags) / build only (manual)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy & the AppImage tools are themselves AppImages that need
          # FUSE to mount; GitHub runners have no FUSE, so make them extract
          # instead of mount. NO_STRIP avoids strip errors on the bundled
          # Python shared objects. (Both are no-ops on macOS/Windows.)
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
        with:
          # Empty tagName on manual runs => build only, no release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'VNStudio ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      # Manual runs have no release to attach to; expose the installers as
      # downloadable workflow artifacts instead.
      - name: Upload installers as artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: vnstudio-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe

  # The two book PDFs ("Le monde vu par les nombres" FR + EN) are final and never
  # rebuilt. They live as assets on the first release; this job carries them
  # forward onto every new release draft so they no longer have to be uploaded
  # by hand. Runs once (not per-platform) after the build matrix succeeds.
  attach-books:
    name: Attach book PDFs to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Canonical source of the (immutable) book PDFs. Change only if these
      # assets are ever moved to a different release tag.
      BOOK_SOURCE_TAG: v0.1.0
    steps:
      - name: Carry book PDFs forward from ${{ env.BOOK_SOURCE_TAG }}
        run: |
          gh release download "$BOOK_SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.pdf' --dir books
          echo "Fetched:" && ls -1 books
          gh release upload "$GITHUB_REF_NAME" books/*.pdf \
            --repo "$GITHUB_REPOSITORY" --clobber
