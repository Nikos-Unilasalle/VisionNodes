name: Deploy Website

on:
  workflow_dispatch:   # manual redeploy (e.g. when a push-triggered run gets stuck)
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
      # RhizoFit web app: Python engine bundled into website/public/rhizofit/engine.zip
      - 'engine/registry.py'
      - 'engine/plugins/**'
      - 'engine/tests/vn_headless.py'
      - 'scripts/radial_zoning_lib.py'
      - 'scripts/cell_recovery_lib.py'
      - 'scripts/cell_files_lib.py'
      - 'scripts/census_lib.py'
      - 'scripts/root_web_runner.py'
      - 'scripts/build_root_webapp.py'
      - 'public/templates/root_predictive_ellipse_zoning.vn'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Bundle the RhizoFit engine 🌱
        run: python3 scripts/build_root_webapp.py

      - name: Install and Build 🏗️
        run: |
          cd website
          npm install
          npm run build

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          force_orphan: true
